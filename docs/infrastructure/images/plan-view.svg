<svg xmlns="http://www.w3.org/2000/svg" viewBox="-260 0 1160 830" width="1160" height="830" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Apotheneum plan view — draft</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b8b"/>
    </marker>
    <marker id="arrowAudio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowNet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6fb8"/>
    </marker>
  </defs>

  <style>
    .lbl   { font-size: 13px; fill: #6b6b6b; }
    .lblb  { font-size: 14px; font-weight: 600; fill: #4a4a4a; }
    .small { font-size: 11px; fill: #8b8b8b; }
    .struct{ fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .box   { fill: #808080; fill-opacity: .10; stroke: #7a7a7a; stroke-width: 1.5; rx: 4; }
    .audio { stroke: #c2410c; stroke-width: 2.5; fill: none; }
    .net   { stroke: #1d6fb8; stroke-width: 2.5; fill: none; }
    .power { stroke: #8b8b8b; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
    .spk   { fill: #c2410c; fill-opacity: .18; stroke: #c2410c; stroke-width: 1.5; }
    .title { font-size: 20px; font-weight: 700; fill: #4a4a4a; }
    .tbd   { font-size: 11px; font-style: italic; fill: #b45309; }
  </style>

  <text class="title" x="-250" y="38">Apotheneum — plan view</text>
  <text class="tbd" x="-250" y="58">DRAFT — positions are placeholders. Correct on site.</text>

  <!-- ==== cube ==== -->
  <rect class="struct" x="230" y="150" width="500" height="500"/>
  <text class="lblb" x="240" y="170">Cube</text>

  <!-- ==== cylinder ==== -->
  <circle class="struct" cx="480" cy="400" r="185"/>
  <text class="lblb" x="480" y="238" text-anchor="middle">Cylinder</text>

  <!-- ==== stage ==== -->
  <rect class="box" x="405" y="330" width="150" height="140"/>
  <text class="lblb" x="480" y="356" text-anchor="middle">Stage</text>
  <text class="lbl"  x="480" y="376" text-anchor="middle">CDJs / decks</text>
  <text class="lbl"  x="480" y="394" text-anchor="middle">mixer</text>
  <rect class="box" x="425" y="406" width="110" height="26"/>
  <text class="small" x="480" y="423" text-anchor="middle">GEARit box (under stage)</text>
  <text class="small" x="480" y="452" text-anchor="middle">haptic floor beneath</text>

  <!-- ==== speakers, 4 corners: 2 high + 2 low each ==== -->
  <g>
    <rect class="spk" x="252" y="176" width="58" height="24" rx="3"/>
    <text class="small" x="281" y="192" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="650" y="176" width="58" height="24" rx="3"/>
    <text class="small" x="679" y="192" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="650" y="600" width="58" height="24" rx="3"/>
    <text class="small" x="679" y="616" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="252" y="600" width="58" height="24" rx="3"/>
    <text class="small" x="281" y="616" text-anchor="middle">2 hi · 2 lo</text>
  </g>

  <!-- ==== generator — furthest out ==== -->
  <rect class="box" x="-250" y="250" width="190" height="66"/>
  <text class="lblb" x="-155" y="276" text-anchor="middle">Generator</text>
  <text class="small" x="-155" y="296" text-anchor="middle">AC to control position</text>

  <!-- ==== control position ==== -->
  <rect class="box" x="-250" y="370" width="190" height="132"/>
  <text class="lblb" x="-155" y="394" text-anchor="middle">Control position</text>
  <text class="lbl"  x="-155" y="418" text-anchor="middle">MacBook (resident)</text>
  <text class="lbl"  x="-155" y="440" text-anchor="middle">MOTU case</text>
  <text class="lbl"  x="-155" y="462" text-anchor="middle">Ashly case</text>
  <text class="small" x="-155" y="484" text-anchor="middle">stacked — see physical.md</text>

  <!-- ==== switch — offset diagonally out from the corner ==== -->
  <rect class="box" x="-40" y="690" width="160" height="52"/>
  <text class="lblb" x="40" y="712" text-anchor="middle">Network switch</text>
  <text class="small" x="40" y="730" text-anchor="middle">10.0.1.0/24</text>

  <!-- ==== live macbook ==== -->
  <rect class="box" x="620" y="720" width="190" height="58"/>
  <text class="lblb" x="715" y="743" text-anchor="middle">Live MacBook</text>
  <text class="small" x="715" y="762" text-anchor="middle">live shows only</text>

  <!-- ==== connections ==== -->
  <!-- generator -> control -->
  <path class="power" d="M -155 316 L -155 370" marker-end="url(#arrow)"/>
  <text class="small" x="-146" y="346">AC</text>

  <!-- control -> switch -->
  <path class="net" d="M -120 502 C -110 600, -80 660, -30 690" marker-end="url(#arrowNet)"/>
  <text class="small" x="-108" y="590" fill="#1d6fb8">Ethernet</text>

  <!-- stage GEARit -> control (analog audio over cat5) -->
  <path class="audio" d="M 425 419 C 240 440, 40 420, -60 420" marker-end="url(#arrowAudio)"/>
  <text class="small" x="190" y="412" text-anchor="middle" fill="#c2410c">Cat5/6 — ANALOG AUDIO</text>

  <!-- Ashly -> speakers, two representative runs -->
  <path class="audio" d="M -70 480 C 60 540, 180 600, 252 610" marker-end="url(#arrowAudio)"/>
  <path class="audio" d="M -70 390 C 40 280, 170 200, 252 188" marker-end="url(#arrowAudio)"/>
  <text class="small" x="30" y="246" fill="#c2410c">speaker runs to 4 corners</text>

  <!-- switch -> LEDs -->
  <path class="net" d="M 60 690 C 90 520, 150 260, 236 176" marker-end="url(#arrowNet)"/>
  <text class="small" x="96" y="560" fill="#1d6fb8">Art-Net</text>
  <text class="small" x="96" y="576" fill="#1d6fb8">32 controllers</text>

  <!-- switch -> haptic floor -->
  <path class="net" d="M 120 716 C 280 716, 400 540, 452 470" marker-end="url(#arrowNet)"/>
  <text class="small" x="250" y="708" fill="#1d6fb8">to haptic floor switch</text>

  <!-- stage CDJ ethernet -> live macbook -->
  <path class="net" d="M 545 440 C 650 500, 700 660, 712 720" marker-end="url(#arrowNet)"/>
  <text class="small" x="660" y="590" fill="#1d6fb8">Cat5/6 — Pro DJ Link</text>

  <!-- live macbook -> switch -->
  <path class="net" d="M 620 756 C 420 812, 200 790, 118 742" marker-end="url(#arrowNet)"/>
  <text class="small" x="380" y="806" text-anchor="middle" fill="#1d6fb8">Ethernet</text>

  <!-- ==== legend ==== -->
  <g transform="translate(640, 90)">
    <rect class="box" x="0" y="-22" width="240" height="98"/>
    <line class="audio" x1="14" y1="0" x2="46" y2="0"/>
    <text class="small" x="56" y="4">audio</text>
    <line class="net" x1="14" y1="24" x2="46" y2="24"/>
    <text class="small" x="56" y="28">network / Art-Net</text>
    <line class="power" x1="14" y1="48" x2="46" y2="48"/>
    <text class="small" x="56" y="52">AC power</text>
  </g>
</svg>
