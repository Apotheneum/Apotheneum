<svg xmlns="http://www.w3.org/2000/svg" viewBox="-260 0 1160 830" width="1160" height="830" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Apotheneum plan view — draft</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b8b"/>
    </marker>
    <marker id="arrowAudio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowNet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6fb8"/>
    </marker>
  </defs>

  <style>
    .lbl   { font-size: 13px; fill: #6b6b6b; }
    .lblb  { font-size: 14px; font-weight: 600; fill: #4a4a4a; }
    .small { font-size: 11px; fill: #8b8b8b; }
    .struct{ fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .box   { fill: #808080; fill-opacity: .10; stroke: #7a7a7a; stroke-width: 1.5; rx: 4; }
    .audio { stroke: #c2410c; stroke-width: 2.5; fill: none; }
    .net   { stroke: #1d6fb8; stroke-width: 2.5; fill: none; }
    .power { stroke: #8b8b8b; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
    .spk   { fill: #c2410c; fill-opacity: .18; stroke: #c2410c; stroke-width: 1.5; }
    .hi    { stroke: #c2410c; stroke-width: 2; fill: none; }
    .lo    { stroke: #c2410c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .title { font-size: 20px; font-weight: 700; fill: #4a4a4a; }
    .tbd   { font-size: 11px; font-style: italic; fill: #b45309; }
  </style>

  <text class="title" x="-250" y="38">Apotheneum — plan view</text>
  <text class="tbd" x="-250" y="58">DRAFT — positions are placeholders. Correct on site.</text>

  <!-- ==== cube ==== -->
  <rect class="struct" x="230" y="150" width="500" height="500"/>
  <text class="lblb" x="240" y="170">Cube</text>

  <!-- ==== cylinder ==== -->
  <circle class="struct" cx="480" cy="400" r="185"/>
  <text class="lblb" x="480" y="238" text-anchor="middle">Cylinder</text>

  <!-- ==== stage ==== -->
  <rect class="box" x="405" y="330" width="150" height="140"/>
  <text class="lblb" x="480" y="356" text-anchor="middle">Stage</text>
  <text class="lbl"  x="480" y="376" text-anchor="middle">CDJs / decks</text>
  <text class="lbl"  x="480" y="394" text-anchor="middle">mixer</text>
  <rect class="box" x="425" y="406" width="110" height="26"/>
  <text class="small" x="480" y="423" text-anchor="middle">GEARit box (under stage)</text>
  <text class="small" x="480" y="452" text-anchor="middle">haptic floor beneath</text>

  <!-- ==== speakers, 4 corners: 2 high + 2 low each ==== -->
  <g>
    <rect class="spk" x="252" y="176" width="58" height="24" rx="3"/>
    <text class="small" x="281" y="192" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="650" y="176" width="58" height="24" rx="3"/>
    <text class="small" x="679" y="192" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="650" y="600" width="58" height="24" rx="3"/>
    <text class="small" x="679" y="616" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="252" y="600" width="58" height="24" rx="3"/>
    <text class="small" x="281" y="616" text-anchor="middle">2 hi · 2 lo</text>
  </g>

  <!-- ==== control position ==== -->
  <rect class="box" x="-250" y="370" width="190" height="132"/>
  <text class="lblb" x="-155" y="394" text-anchor="middle">Control position</text>
  <text class="lbl"  x="-155" y="418" text-anchor="middle">MacBook (resident)</text>
  <text class="lbl"  x="-155" y="440" text-anchor="middle">MOTU case</text>
  <text class="lbl"  x="-155" y="462" text-anchor="middle">Ashly case</text>
  <text class="small" x="-155" y="484" text-anchor="middle">stacked — see physical.md</text>

  <!-- ==== GEARit box at the control position ==== -->
  <rect class="box" x="-250" y="530" width="190" height="46"/>
  <text class="lblb" x="-155" y="552" text-anchor="middle">GEARit box</text>
  <text class="small" x="-155" y="568" text-anchor="middle">at the control position</text>

  <!-- ==== haptic floor controller ==== -->
  <rect class="box" x="-250" y="600" width="190" height="54"/>
  <text class="lblb" x="-155" y="622" text-anchor="middle">Floor controller</text>
  <text class="small" x="-155" y="640" text-anchor="middle">drives haptics on an interval</text>

  <!-- ==== switch — offset diagonally out from the corner ==== -->
  <rect class="box" x="-40" y="690" width="160" height="52"/>
  <text class="lblb" x="40" y="712" text-anchor="middle">Network switch</text>
  <text class="small" x="40" y="730" text-anchor="middle">10.0.1.0/24</text>

  <!-- ==== floor ethernet box, at the corner of the floor ==== -->
  <rect class="box" x="342" y="478" width="132" height="36"/>
  <text class="small" x="408" y="494" text-anchor="middle">Floor ethernet box</text>
  <text class="small" x="408" y="508" text-anchor="middle">motors + lights</text>

  <!-- ==== live macbook ==== -->
  <rect class="box" x="566" y="478" width="158" height="52"/>
  <text class="lblb" x="645" y="500" text-anchor="middle">Live MacBook</text>
  <text class="small" x="645" y="518" text-anchor="middle">stage edge, live only</text>

  <!-- ==== connections ==== -->
  <!-- control -> switch -->
  <path class="net" d="M -60 470 C 10 540, -20 640, -25 690" marker-end="url(#arrowNet)"/>
  <text class="small" x="-16" y="600" fill="#1d6fb8">Ethernet</text>

  <!-- stage GEARit -> control (analog audio over cat5) -->
  <path class="net" d="M 425 425 C 240 500, 40 560, -60 553" marker-end="url(#arrowNet)"/>
  <text class="small" x="190" y="528" text-anchor="middle" fill="#c2410c">Cat5/6 cable — ANALOG AUDIO inside</text>

  <!-- GEARit -> MOTU, short XLR hop -->
  <path class="audio" d="M -155 530 L -155 502" marker-end="url(#arrowAudio)"/>
  <text class="small" x="-146" y="522" fill="#c2410c">2x XLR</text>

  <!-- Ashly -> 4 corners, one cable per driver type (8 total) -->
  <!-- NW -->
  <path class="hi" d="M -60 390 C 40 302, 158 212, 248 190" marker-end="url(#arrowAudio)"/>
  <path class="lo" d="M -60 400 C 48 320, 168 228, 252 202" marker-end="url(#arrowAudio)"/>
  <!-- SW -->
  <path class="hi" d="M -60 476 C 40 546, 160 596, 248 606" marker-end="url(#arrowAudio)"/>
  <path class="lo" d="M -60 486 C 48 562, 170 612, 252 620" marker-end="url(#arrowAudio)"/>
  <!-- NE, routed over the top -->
  <path class="hi" d="M -60 380 C 0 128, 330 98, 668 170" marker-end="url(#arrowAudio)"/>
  <path class="lo" d="M -60 370 C 10 108, 340 78, 686 168" marker-end="url(#arrowAudio)"/>
  <!-- SE, routed along the bottom -->
  <path class="hi" d="M -60 494 C 70 668, 400 664, 668 628" marker-end="url(#arrowAudio)"/>
  <path class="lo" d="M -60 504 C 78 686, 410 682, 686 630" marker-end="url(#arrowAudio)"/>
  <text class="small" x="-46" y="330" fill="#c2410c">8 runs: high + low</text>
  <text class="small" x="-46" y="345" fill="#c2410c">to each of 4 corners</text>

  <!-- switch -> LEDs -->
  <path class="net" d="M 60 690 C 90 520, 150 260, 236 176" marker-end="url(#arrowNet)"/>
  <text class="small" x="96" y="560" fill="#1d6fb8">Art-Net</text>
  <text class="small" x="96" y="576" fill="#1d6fb8">32 controllers</text>

  <!-- floor controller -> haptic floor -->
  <path class="net" d="M -60 618 C 120 604, 250 560, 340 502" marker-end="url(#arrowNet)"/>
  <text class="small" x="104" y="590" fill="#1d6fb8">to floor ethernet box</text>

  <!-- switch -> haptic floor -->
  <path class="net" d="M 120 704 C 250 664, 340 570, 380 516" marker-end="url(#arrowNet)"/>
  <text class="small" x="212" y="664" fill="#1d6fb8">Art-Net to floor</text>

  <!-- stage CDJ ethernet -> live macbook -->
  <path class="net" d="M 552 452 L 594 478" marker-end="url(#arrowNet)"/>
  <text class="small" x="556" y="474" fill="#1d6fb8">Pro DJ Link</text>

  <!-- live macbook -> switch -->
  <path class="net" d="M 600 530 C 470 700, 260 760, 122 730" marker-end="url(#arrowNet)"/>
  <text class="small" x="376" y="754" text-anchor="middle" fill="#1d6fb8">Ethernet to switch</text>

  <!-- ==== legend ==== -->
  <g transform="translate(640, 240)">
    <rect class="box" x="0" y="-22" width="240" height="122"/>
    <line class="audio" x1="14" y1="0" x2="46" y2="0"/>
    <text class="small" x="56" y="4">audio</text>
    <line class="hi" x1="14" y1="24" x2="46" y2="24"/>
    <text class="small" x="56" y="28">speaker run — high</text>
    <line class="lo" x1="14" y1="48" x2="46" y2="48"/>
    <text class="small" x="56" y="52">speaker run — low</text>
    <line class="net" x1="14" y1="72" x2="46" y2="72"/>
    <text class="small" x="56" y="76">network / Art-Net</text>
  </g>
</svg>
