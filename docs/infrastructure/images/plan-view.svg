<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 0 1400 830" width="1400" height="830" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Apotheneum plan view — draft</title>

  <defs>
    <marker id="arrowAudio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowNet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d6fb8"/>
    </marker>
  </defs>

  <style>
    .lbl   { font-size: 13px; fill: #6b6b6b; }
    .lblb  { font-size: 14px; font-weight: 600; fill: #4a4a4a; }
    .small { font-size: 11px; fill: #8b8b8b; }
    .struct{ fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .box   { fill: #808080; fill-opacity: .10; stroke: #7a7a7a; stroke-width: 1.5; rx: 4; }
    .audio { stroke: #c2410c; stroke-width: 2.5; fill: none; }
    .net   { stroke: #1d6fb8; stroke-width: 2.5; fill: none; }
    .hi    { stroke: #c2410c; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    .lo    { stroke: #c2410c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; stroke-linejoin: round; stroke-linecap: round; }
    .spk   { fill: #c2410c; fill-opacity: .18; stroke: #c2410c; stroke-width: 1.5; }
    .title { font-size: 20px; font-weight: 700; fill: #4a4a4a; }
    .tbd   { font-size: 11px; font-style: italic; fill: #b45309; }
  </style>

  <text class="title" x="-490" y="38">Apotheneum — plan view</text>
  <text class="tbd" x="-490" y="58">DRAFT — positions are placeholders. Correct on site.</text>

  <!-- ==== cube ==== -->
  <rect class="struct" x="230" y="150" width="500" height="500"/>
  <text class="lblb" x="240" y="170">Cube</text>

  <!-- ==== cylinder ==== -->
  <circle class="struct" cx="480" cy="400" r="185"/>
  <text class="lblb" x="480" y="238" text-anchor="middle">Cylinder</text>

  <!-- ==== stage ==== -->
  <rect class="box" x="405" y="330" width="150" height="140"/>
  <text class="lblb" x="480" y="348" text-anchor="middle">Stage</text>

  <rect class="box" x="414" y="358" width="132" height="42"/>
  <text class="lblb" x="480" y="376" text-anchor="middle">DJ decks</text>
  <text class="small" x="480" y="392" text-anchor="middle">CDJs + mixer</text>

  <rect class="box" x="414" y="424" width="132" height="36"/>
  <text class="small" x="480" y="440" text-anchor="middle">GEARit box</text>
  <text class="small" x="480" y="454" text-anchor="middle">under stage</text>

  <path class="audio" d="M 480 400 L 480 424" marker-end="url(#arrowAudio)"/>
  <text class="small" x="488" y="418" fill="#c2410c">2x XLR</text>

  <!-- ==== floor ethernet box, corner of the floor ==== -->
  <rect class="box" x="342" y="478" width="132" height="36"/>
  <text class="lblb" x="408" y="494" text-anchor="middle">Stage switch</text>
  <text class="small" x="408" y="508" text-anchor="middle">motors + lights</text>

  <!-- ==== live macbook ==== -->
  <rect class="box" x="566" y="478" width="158" height="52"/>
  <text class="lblb" x="645" y="500" text-anchor="middle">Live MacBook</text>
  <text class="small" x="645" y="518" text-anchor="middle">stage edge, live only</text>

  <!-- ==== speakers, 4 corners ==== -->
  <g>
    <rect class="spk" x="252" y="176" width="58" height="24" rx="3"/>
    <text class="small" x="281" y="192" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="650" y="176" width="58" height="24" rx="3"/>
    <text class="small" x="679" y="192" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="650" y="600" width="58" height="24" rx="3"/>
    <text class="small" x="679" y="616" text-anchor="middle">2 hi · 2 lo</text>
    <rect class="spk" x="252" y="600" width="58" height="24" rx="3"/>
    <text class="small" x="281" y="616" text-anchor="middle">2 hi · 2 lo</text>
  </g>

  <!-- ==== control position: signal chain, top to bottom ==== -->
  <text class="small" x="-155" y="272" text-anchor="middle">— control position —</text>

  <rect class="box" x="-250" y="286" width="190" height="46"/>
  <text class="lblb" x="-155" y="304" text-anchor="middle">GEARit box</text>
  <text class="small" x="-155" y="322" text-anchor="middle">receives the stage snake</text>

  <rect class="box" x="-250" y="378" width="190" height="46"/>
  <text class="lblb" x="-155" y="396" text-anchor="middle">MOTU M4</text>
  <text class="small" x="-155" y="414" text-anchor="middle">in its Pelican case</text>

  <rect class="box" x="-250" y="470" width="190" height="52"/>
  <text class="lblb" x="-155" y="490" text-anchor="middle">Ashly AQM408</text>
  <text class="small" x="-155" y="508" text-anchor="middle">matrix + crossover</text>

  <!-- ==== macbook, offset ==== -->
  <rect class="box" x="-470" y="368" width="180" height="66"/>
  <text class="lblb" x="-380" y="392" text-anchor="middle">Resident MacBook</text>
  <text class="small" x="-380" y="410" text-anchor="middle">on top of the MOTU case</text>
  <text class="small" x="-380" y="426" text-anchor="middle">prerecorded shows</text>

  <!-- ==== floor controller ==== -->
  <rect class="box" x="-470" y="466" width="180" height="56"/>
  <text class="lblb" x="-380" y="489" text-anchor="middle">Floor controller</text>
  <text class="small" x="-380" y="507" text-anchor="middle">haptics, on an interval</text>

  <!-- ==== switch at the control position ==== -->
  <rect class="box" x="-470" y="566" width="180" height="40"/>
  <text class="lblb" x="-380" y="591" text-anchor="middle">Local switch</text>

  <!-- ==== switch, at the cube corner ==== -->
  <rect class="box" x="150" y="700" width="160" height="40"/>
  <text class="lblb" x="230" y="725" text-anchor="middle">Network switch</text>

  <!-- ================= connections ================= -->

  <!-- stage snake -> GEARit at control position (Cat5 cable, analog inside) -->
  <path class="net" d="M 414 436 C 240 380, 40 322, -60 310" marker-end="url(#arrowNet)"/>
  <text class="small" x="182" y="344" text-anchor="middle" fill="#c2410c">Cat5/6 cable — ANALOG AUDIO inside</text>

  <!-- GEARit -> MOTU -->
  <path class="audio" d="M -155 332 L -155 378" marker-end="url(#arrowAudio)"/>
  <text class="small" x="-148" y="358">2x XLR</text>

  <!-- MacBook -> MOTU -->
  <path class="net" d="M -290 398 L -250 398" marker-end="url(#arrowNet)"/>
  <text class="small" x="-288" y="390">USB-C</text>

  <!-- MOTU -> Ashly -->
  <path class="audio" d="M -155 424 L -155 470" marker-end="url(#arrowAudio)"/>
  <text class="small" x="-148" y="450">2x TRS → Euroblock</text>

  <!-- MacBook -> local switch -->
  <path class="net" d="M -290 424 C -244 470, -244 546, -290 580" marker-end="url(#arrowNet)"/>
  <text class="small" x="-238" y="508" fill="#1d6fb8">Ethernet</text>

  <!-- Ashly -> corners: out to the near corner, then along the cube edges -->
  <!-- NW -->
  <path class="hi" d="M -60 484 L 206 484 L 206 188 L 248 188" marker-end="url(#arrowAudio)"/>
  <path class="lo" d="M -60 494 L 196 494 L 196 200 L 248 200" marker-end="url(#arrowAudio)"/>
  <!-- SW -->
  <path class="hi" d="M -60 484 L 206 484 L 206 606 L 248 606" marker-end="url(#arrowAudio)"/>
  <path class="lo" d="M -60 494 L 196 494 L 196 618 L 248 618" marker-end="url(#arrowAudio)"/>
  <!-- NE, up the left edge and across the top -->
  <path class="hi" d="M -60 484 L 206 484 L 206 128 L 756 128 L 756 186 L 712 186" marker-end="url(#arrowAudio)"/>
  <path class="lo" d="M -60 494 L 196 494 L 196 116 L 768 116 L 768 198 L 712 198" marker-end="url(#arrowAudio)"/>
  <!-- SE, along the bottom and up the right edge -->
  <path class="hi" d="M -60 484 L 206 484 L 206 674 L 756 674 L 756 610 L 712 610" marker-end="url(#arrowAudio)"/>
  <path class="lo" d="M -60 494 L 196 494 L 196 686 L 768 686 L 768 622 L 712 622" marker-end="url(#arrowAudio)"/>
  <text class="small" x="-56" y="546" fill="#c2410c">8 runs: high + low to each corner,</text>
  <text class="small" x="-56" y="560" fill="#c2410c">routed along the cube edges</text>

  <!-- floor controller -> corner switch -->
  <path class="net" d="M -380 522 L -380 566" marker-end="url(#arrowNet)"/>
  <text class="small" x="-374" y="548" fill="#1d6fb8">Ethernet</text>

  <!-- local switch -> corner switch, one cable -->
  <path class="net" d="M -290 596 C -120 700, 20 736, 148 724" marker-end="url(#arrowNet)"/>
  <text class="small" x="-176" y="690" fill="#1d6fb8">single cable to the corner</text>

  <!-- switch -> LEDs -->
  <path class="net" d="M 206 700 L 206 664" marker-end="url(#arrowNet)"/>
  <text class="small" x="30" y="664" fill="#1d6fb8">Art-Net — 32 LED controllers</text>

  <!-- switch -> floor -->
  <path class="net" d="M 290 700 C 330 620, 348 556, 376 516" marker-end="url(#arrowNet)"/>
  <text class="small" x="300" y="612" fill="#1d6fb8">uplink to stage switch</text>

  <!-- CDJs -> live macbook -->
  <path class="net" d="M 546 384 C 600 400, 630 440, 640 478" marker-end="url(#arrowNet)"/>
  <text class="small" x="596" y="424" fill="#1d6fb8">Pro DJ Link</text>

  <!-- live macbook -> switch -->
  <path class="net" d="M 600 530 C 480 620, 460 528, 474 502" marker-end="url(#arrowNet)"/>
  <text class="small" x="520" y="568" fill="#1d6fb8">Ethernet to stage switch</text>

  <!-- ==== legend ==== -->
  <g transform="translate(-490, 100)">
    <rect class="box" x="0" y="-22" width="240" height="122"/>
    <line class="audio" x1="14" y1="0" x2="46" y2="0"/>
    <text class="small" x="56" y="4">audio</text>
    <line class="hi" x1="14" y1="24" x2="46" y2="24"/>
    <text class="small" x="56" y="28">speaker run — high</text>
    <line class="lo" x1="14" y1="48" x2="46" y2="48"/>
    <text class="small" x="56" y="52">speaker run — low</text>
    <line class="net" x1="14" y1="72" x2="46" y2="72"/>
    <text class="small" x="56" y="76">network / Art-Net</text>
  </g>
</svg>
