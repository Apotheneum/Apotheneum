name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, not a single commit. The review is a diff against the
          # PR base, and several of the paths there are local git: `git diff
          # <base>...HEAD` to scope the review, `git log`/`git blame` for the
          # history behind a line, `git rev-parse` for the full SHA the inline
          # comments need to build permalinks. At depth 1 the base commit is not
          # in the clone, so all of those return nothing and the reviewer has
          # nothing to review.
          fetch-depth: 0

      # The review plugin is fetched at run time, so without a pin the reviewer's
      # behaviour changes with no commit here — an upstream edit to the command
      # silently rewrites what "passing review" means. plugin_marketplaces
      # validates URLs against ^https://.+\.git$, so a #ref suffix is rejected;
      # local paths are accepted, so the pin is our own clone at a fixed SHA.
      #
      # The name in .claude-plugin/marketplace.json has to change: Claude Code
      # reserves 'claude-code-plugins' for GitHub sources in the anthropics org
      # and refuses a local copy claiming it. The plugin's own name is what the
      # slash command is namespaced by, so /code-review:code-review is unaffected.
      #
      # To update: bump MARKETPLACE_REF and read the diff of
      # plugins/code-review/commands/code-review.md between the two SHAs.
      - name: Pin the review plugin marketplace
        env:
          MARKETPLACE_REF: 8a8e81d098cbd0fae4ee5b9c853542945fe87016
          MARKETPLACE_DIR: ${{ runner.temp }}/review-plugin-marketplace
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/anthropics/claude-code.git "$MARKETPLACE_DIR"
          git -C "$MARKETPLACE_DIR" sparse-checkout set --cone \
            .claude-plugin plugins/code-review
          git -C "$MARKETPLACE_DIR" checkout --detach "$MARKETPLACE_REF"
          manifest="$MARKETPLACE_DIR/.claude-plugin/marketplace.json"
          jq '.name = "pinned-claude-code-plugins"' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          echo "Pinned review plugin marketplace at $MARKETPLACE_REF"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ runner.temp }}/review-plugin-marketplace
          plugins: 'code-review@pinned-claude-code-plugins'
          # The action owns publishing the summary, rather than the reviewer
          # shelling out to `gh pr comment` and hoping the quoting survives.
          #
          # A review summary is multi-line markdown, which is exactly the shape
          # that wants a heredoc — and heredocs, command substitution and
          # redirection are all refused by the permission system's static
          # analysis, even under a matching Bash(gh pr comment:*) rule. That has
          # now cost three separate silent failures: 13 denials on an 874-line
          # diff, then 14 denials on PR #118, each ending with a green check and
          # an empty PR. The last attempt at a fix was the paragraph of warning
          # text in --append-system-prompt below, and the reviewer walked into it
          # anyway, because a prompt asking a model to avoid a shell idiom is a
          # request, not a constraint.
          #
          # track_progress makes the action maintain a tracking comment on the PR
          # and deliver the reviewer's final report into it. Publishing stops
          # depending on a command the reviewer has to construct correctly, so
          # the failure mode is gone rather than warned about. Inline comments
          # were never affected: those go through the MCP tool, which needs no
          # shell. Applies to pull_request opened/synchronize/ready_for_review/
          # reopened/labeled, which covers this workflow's whole trigger set —
          # the first four.
          track_progress: true
          # One comment that gets updated, instead of a new one per push.
          use_sticky_comment: true
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # --allowedTools is a whitelist, not an addition: what is listed here is
          # the only thing the reviewer can call, and there is no prompt to fall
          # back on in CI, so anything omitted is silently denied. Listing only the
          # inline-comment tool left the reviewer able to publish but unable to
          # read, which is why the check was green and empty — runs ended with
          # permission_denials_count: 13 and posted nothing on an 874-line diff.
          #
          # What /code-review:code-review actually needs:
          #   Task/Agent  - the command is entirely subagent-driven ("launch 4
          #                 agents in parallel"); without it nothing runs at all.
          #                 Both names are listed because the tool is Task in
          #                 older CLI builds and Agent in newer ones.
          #   Read/Grep/Glob - reading the changed files, the CLAUDE.md files it
          #                 checks compliance against, and docs/lx-coding-guidelines.md
          #                 as instructed by --append-system-prompt below.
          #   gh pr/issue/search - fetching the PR and its diff. Note that
          #                 Bash(gh pr comment:*) is deliberately NOT here: it
          #                 existed only to publish the summary, which
          #                 track_progress now owns. Re-adding it would restore
          #                 the trap described above, and a "fallback" that has
          #                 failed silently three times is not a fallback.
          #   git         - diff scoping, history context, and the full SHA that
          #                 permalinks in inline comments require.
          #   ls/cat/find/git status - what the review subagents reach for to orient
          #                 themselves. Denying them does not stop the review, it just
          #                 makes it worse: 173 denials across the 29 runs since the
          #                 last fix were almost all `find . -name CLAUDE.md`, `ls`,
          #                 and `git status`. All are read-only and none can reach the
          #                 network, so they add nothing to the exfiltration surface
          #                 that Read/Grep/Glob already cover.
          #
          # Bash is scoped to those read-only git/gh verbs rather than opened up
          # wholesale: this job reads PR-authored content while holding
          # CLAUDE_CODE_OAUTH_TOKEN, so unrestricted shell would turn a malicious
          # diff into a credential-exfiltration path.
          #
          # AGENTS.md already points at the coding guidelines, and CLAUDE.md imports
          # it, so the reviewer starts with that pointer in context — but following a
          # pointer is a choice. --append-system-prompt makes it an instruction, and
          # goes in claude_args rather than prompt so the slash command above still
          # parses as a command.
          claude_args: >-
            --allowedTools "Task,Agent,TodoWrite,Read,Grep,Glob,Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Before reviewing, read docs/lx-coding-guidelines.md
            and apply its Part 3 review checklist alongside the standard review
            criteria. It records LX idioms specific to this repo that a general review
            will miss: no allocation in the render loop, enums carrying behavior
            instead of magic constants or string maps, framework helpers over
            reinvention, symmetric listener and plugin lifecycle, and staying within
            model bounds including the door cutouts.
            Your final assistant message IS the published review. The action delivers
            it to the pull request as a tracking comment, so end the run with the
            complete review summary as that final message — not a status line about
            work you did. There is no gh pr comment available and no other publishing
            path; do not attempt to shell out to post the summary."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The Claude process exits 0 whether or not it managed to do the job, so a
      # run that was blocked from every tool it needed still reports `pass`. That
      # is how PR #118 carried a green check for a review that posted nothing.
      # This step reads the run's own accounting and refuses to call that a pass.
      #
      # A denial used to be noise: the review subagents reach for `ls`, `cat`,
      # `find` and `git status` to orient themselves, and those made up almost all
      # of the 173 denials across 29 runs. They are now on the allowlist, so a
      # denial no longer means "the agent tried something incidental" — it means
      # the reviewer wanted a capability it does not have, and whatever it was
      # doing with that capability did not happen. Failing loudly is the point:
      # an incomplete or unpublished review should not look like a clean one.
      #
      # If this does turn out to be noisy in practice, downgrade it to a warning
      # annotation. Do not delete it — without some signal here, the silent
      # green check comes straight back.
      - name: Fail on reviewer permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -uo pipefail
          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::warning::No Claude execution output file at '${EXECUTION_FILE:-<unset>}' - cannot verify whether the reviewer hit permission denials."
            exit 0
          fi
          # -s tolerates both shapes the file has been seen in: a single JSON
          # array of messages (slurped to [[...]]) and JSONL (slurped to [...]).
          # Flattening one level normalises them before looking for the result
          # object that carries the count.
          denials="$(jq -s -r '
            [ .[] | if type == "array" then .[] else . end ]
            | map(select(type == "object" and .type == "result"))
            | map(.permission_denials_count // 0)
            | (max // 0)
          ' "$EXECUTION_FILE" 2>/dev/null)" || denials=""
          if [ -z "$denials" ] || ! [ "$denials" -eq "$denials" ] 2>/dev/null; then
            echo "::warning::Could not parse a permission_denials_count out of '$EXECUTION_FILE' - skipping the check rather than failing on a parse problem."
            exit 0
          fi
          echo "permission_denials_count: $denials"
          if [ "$denials" -gt 0 ]; then
            echo "::error::The reviewer was denied $denials tool call(s) it tried to make, so it was blocked from something it needed. The review may be incomplete, and may not have been published to the PR at all. Check the run log for the denied commands and either add them to --allowedTools or remove whatever made the reviewer reach for them."
            exit 1
          fi
          echo "Reviewer completed with no permission denials."
