name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, not a single commit. The review is a diff against the
          # PR base, and several of the paths there are local git: `git diff
          # <base>...HEAD` to scope the review, `git log`/`git blame` for the
          # history behind a line, `git rev-parse` for the full SHA the inline
          # comments need to build permalinks. At depth 1 the base commit is not
          # in the clone, so all of those return nothing and the reviewer has
          # nothing to review.
          fetch-depth: 0

      # The review plugin is fetched at run time, so without a pin the reviewer's
      # behaviour changes with no commit here — an upstream edit to the command
      # silently rewrites what "passing review" means. plugin_marketplaces
      # validates URLs against ^https://.+\.git$, so a #ref suffix is rejected;
      # local paths are accepted, so the pin is our own clone at a fixed SHA.
      #
      # The name in .claude-plugin/marketplace.json has to change: Claude Code
      # reserves 'claude-code-plugins' for GitHub sources in the anthropics org
      # and refuses a local copy claiming it. The plugin's own name is what the
      # slash command is namespaced by, so /code-review:code-review is unaffected.
      #
      # To update: bump MARKETPLACE_REF and read the diff of
      # plugins/code-review/commands/code-review.md between the two SHAs.
      - name: Pin the review plugin marketplace
        env:
          MARKETPLACE_REF: 8a8e81d098cbd0fae4ee5b9c853542945fe87016
          MARKETPLACE_DIR: ${{ runner.temp }}/review-plugin-marketplace
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/anthropics/claude-code.git "$MARKETPLACE_DIR"
          git -C "$MARKETPLACE_DIR" sparse-checkout set --cone \
            .claude-plugin plugins/code-review
          git -C "$MARKETPLACE_DIR" checkout --detach "$MARKETPLACE_REF"
          manifest="$MARKETPLACE_DIR/.claude-plugin/marketplace.json"
          jq '.name = "pinned-claude-code-plugins"' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"
          echo "Pinned review plugin marketplace at $MARKETPLACE_REF"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ runner.temp }}/review-plugin-marketplace
          plugins: 'code-review@pinned-claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Without this the final review text only ever reaches the raw
          # execution log, never the job summary — a run that read the whole
          # diff and decided to say nothing looked, from the Actions UI,
          # identical to one that crashed before doing any work. This is a
          # public repo, so only display_report is set; show_full_output
          # would echo raw tool output (including anything a malicious diff
          # tricked a tool into printing) into a page anyone can read.
          display_report: true
          # --allowedTools is a whitelist, not an addition: what is listed here is
          # the only thing the reviewer can call, and there is no prompt to fall
          # back on in CI, so anything omitted is silently denied. Listing only the
          # inline-comment tool left the reviewer able to publish but unable to
          # read, which is why the check was green and empty — runs ended with
          # permission_denials_count: 13 and posted nothing on an 874-line diff.
          #
          # What /code-review:code-review actually needs:
          #   Task/Agent  - the command is entirely subagent-driven ("launch 4
          #                 agents in parallel"); without it nothing runs at all.
          #                 Both names are listed because the tool is Task in
          #                 older CLI builds and Agent in newer ones.
          #   Read/Grep/Glob - reading the changed files, the CLAUDE.md files it
          #                 checks compliance against, and docs/lx-coding-guidelines.md
          #                 as instructed by --append-system-prompt below.
          #   gh pr/issue/search - fetching the PR and its diff, and posting the
          #                 "no issues found" summary when the review comes up clean.
          #   git         - diff scoping, history context, and the full SHA that
          #                 permalinks in inline comments require.
          #   ls/cat/find/git status - what the review subagents reach for to orient
          #                 themselves. Denying them does not stop the review, it just
          #                 makes it worse: 173 denials across the 29 runs since the
          #                 last fix were almost all `find . -name CLAUDE.md`, `ls`,
          #                 and `git status`. All are read-only and none can reach the
          #                 network, so they add nothing to the exfiltration surface
          #                 that Read/Grep/Glob already cover.
          #
          # Bash is scoped to those read-only git/gh verbs rather than opened up
          # wholesale: this job reads PR-authored content while holding
          # CLAUDE_CODE_OAUTH_TOKEN, so unrestricted shell would turn a malicious
          # diff into a credential-exfiltration path.
          #
          # AGENTS.md already points at the coding guidelines, and CLAUDE.md imports
          # it, so the reviewer starts with that pointer in context — but following a
          # pointer is a choice. --append-system-prompt makes it an instruction, and
          # goes in claude_args rather than prompt so the slash command above still
          # parses as a command.
          claude_args: >-
            --allowedTools "Task,Agent,TodoWrite,Read,Grep,Glob,Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Before reviewing, read docs/lx-coding-guidelines.md
            and apply its Part 3 review checklist alongside the standard review
            criteria. It records LX idioms specific to this repo that a general review
            will miss: no allocation in the render loop, enums carrying behavior
            instead of magic constants or string maps, framework helpers over
            reinvention, symmetric listener and plugin lifecycle, and staying within
            model bounds including the door cutouts.
            When you publish the review summary with gh pr comment, write the comment
            text inline as a single literal --body argument. The permission system
            refuses any Bash command it cannot analyse statically, so command
            substitution, heredocs and output redirection are all denied under the
            Bash(gh pr comment:*) rule. A clean review has no other way to publish, so
            a command built by any of those means ends the run having posted nothing.
            End your final message with exactly one of two markers, alone on its own
            line: REVIEW_PUBLISHED once a comment has actually been posted to the pull
            request, whether it lists findings or reports a clean review, or
            REVIEW_SKIPPED: <short reason> if the review was deliberately not run at
            all, for example because the pull request is closed, in draft, or was
            already reviewed. The step after this one reads that marker, and a run
            carrying neither fails the check."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Everything above is a nudge to a model: publish the summary this way,
      # end with that marker. None of it fails the check when the model does
      # something else, which is how 29 runs cost $35.96 and published three
      # times while every one of them reported success (#86). This step is the
      # part that does not depend on the model complying. It reads the raw SDK
      # message log rather than the sanitized console output, because that is
      # the only place the final result text and the permission_denials array
      # both survive — the console shows a denial count and no names.
      #
      # A run may legitimately publish nothing: the plugin's first step bails
      # on a pull request that is closed, in draft, or already reviewed. That
      # is what REVIEW_SKIPPED distinguishes from a review that ran and lost
      # its output, and why the check reads a marker instead of just asking
      # whether a comment exists.
      - name: Verify review was published
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -euo pipefail

          if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file was produced (steps.claude-review.outputs.execution_file is empty or missing) -- skipping the publish check rather than masking whatever earlier step already failed."
            exit 0
          fi

          RESULT_JSON=$(jq -c '[.[] | select(.type == "result")] | last' "$EXECUTION_FILE")

          if [ -z "$RESULT_JSON" ] || [ "$RESULT_JSON" = "null" ]; then
            echo "No .type == \"result\" message found in $EXECUTION_FILE."
            echo "### Code review verification failed" >> "$GITHUB_STEP_SUMMARY"
            echo "No result message was found in the execution log." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          DENIAL_COUNT=$(echo "$RESULT_JSON" | jq '.permission_denials | length')

          if [ "$DENIAL_COUNT" -gt 0 ]; then
            # Tool names and (for Bash) only the first three tokens of the
            # command -- this is a public repo, and the full command or any
            # tool output could carry file contents or credentials pulled in
            # while handling a PR diff we don't control.
            echo "The review was denied permission to use one or more tools:"
            echo "$RESULT_JSON" | jq -r '.permission_denials[] | if .tool_name == "Bash" then "Bash: " + ((.tool_input.command // "") | split(" ") | .[0:3] | join(" ")) else .tool_name end'
            echo "### Code review verification failed" >> "$GITHUB_STEP_SUMMARY"
            echo "The review was denied permission to use one or more tools -- see the job log for which ones." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          RESULT_TEXT=$(echo "$RESULT_JSON" | jq -r '.result // ""')

          if echo "$RESULT_TEXT" | grep -q "REVIEW_SKIPPED"; then
            echo "Review was deliberately skipped:"
            echo "$RESULT_TEXT" | grep "REVIEW_SKIPPED"
            exit 0
          fi

          if echo "$RESULT_TEXT" | grep -q "REVIEW_PUBLISHED"; then
            echo "Review was published."
            exit 0
          fi

          echo "The review ended without publishing a result or declaring a skip (no REVIEW_PUBLISHED or REVIEW_SKIPPED marker found)."
          echo "### Code review verification failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The review ended without a REVIEW_PUBLISHED or REVIEW_SKIPPED marker -- it may have posted nothing." >> "$GITHUB_STEP_SUMMARY"
          exit 1
