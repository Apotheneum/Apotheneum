name: build

# Compile + test on every PR and every push to main, so breakage is caught here
# rather than the next time someone builds locally.
#
# Tests are opt-in locally (maven.test.skip defaults to true) so a pattern author
# never waits on them, but always-on here — hence `-Ptests`. Without that profile
# this job would compile and run nothing under src/test, while looking green.
#
# Those tests construct a headless LX, which starts javax.sound audio and MIDI
# device scans; that works on a bare runner with no sound card and needs no xvfb.
#
# Note surefire is configured with reuseForks=false, so each test class gets its
# own JVM — this is slower than a normal suite, and deliberately so (see pom.xml).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # `mvn package` runs plugin code from the PR branch; give it nothing

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # JDK 25, not 21. Chromatik 1.2.2 (lx/glx/glxstudio) is compiled at release
      # 25, so its class files are major version 69 and javac 21 refuses to read
      # them off the classpath. The pom still sets maven.compiler.release 21, so
      # this does not change the language level or the bytecode we emit.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # AGENTS.md is canonical; CLAUDE.md imports it. A broken import fails
      # silently — Claude Code just loads nothing — so check it here. Runs before
      # the build: it takes a second, and there's no reason to sit through a
      # compile to learn a doc link is broken.
      - name: check agent instructions
        run: ./scripts/check-agent-instructions.sh

      # Plain `package` — NOT -Pinstall, which copies the jar into
      # ~/Chromatik/Packages (pointless on a runner). `-Ptests` is what actually
      # runs the suite; see the note at the top of this file.
      - name: mvn package
        run: mvn -B -Ptests package
